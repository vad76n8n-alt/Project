<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проекты — Demo</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--primary:#2563eb;--primary2:#1d4ed8;--shadow:0 10px 30px #10182814;--r:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(135deg,#f8fafc,#eef4ff);min-height:100vh}button,input,textarea,select{font:inherit}.app{max-width:1180px;margin:auto;padding:28px 20px 48px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}h1{margin:0 0 6px;font-size:32px}.subtitle{margin:0;color:var(--muted)}.btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700}.primary{background:var(--primary);color:#fff;box-shadow:0 5px 14px #2563eb38}.primary:hover{background:var(--primary2)}.secondary{background:#eef2f6;color:#344054}.toolbar{background:#ffffffdd;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:18px;display:flex;gap:12px;align-items:center}.search-wrap{position:relative;flex:1;min-width:0}.search-wrap span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#98a2b3}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;outline:0}.count{color:var(--muted);white-space:nowrap;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card h2{margin:0;font-size:19px}.status{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:#ecfdf3;color:#067647}.planned{background:#eff8ff;color:#175cd3}.paused{background:#fff7ed;color:#c2410c}.description{color:#667085;line-height:1.5;margin:13px 0;flex:1}.meta{display:flex;justify-content:space-between;gap:10px;padding-top:13px;border-top:1px solid #f0f2f5;color:#667085;font-size:13px}.empty{grid-column:1/-1;text-align:center;padding:54px 20px;color:var(--muted);background:#ffffffb3;border:1px dashed #cfd6e0;border-radius:var(--r)}.backdrop{position:fixed;inset:0;background:#0f172a75;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.backdrop.open{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:20px;box-shadow:0 24px 70px #0f172a40;overflow:hidden}.mh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.mh h2{margin:0;font-size:21px}.close{border:0;background:transparent;font-size:25px;color:#667085;cursor:pointer}form{padding:22px}.field{margin-bottom:17px}label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:0;background:#fff}textarea{min-height:100px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}.error{color:#dc2626;font-size:13px;margin-top:6px;display:none}.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.app{padding:20px 14px 36px}header{flex-direction:column}header .btn{width:100%}h1{font-size:28px}.toolbar{flex-direction:column;align-items:stretch}.count{text-align:right}.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header><div><h1>Проекты</h1><p class="subtitle">Тестовый интерфейс управления проектами</p></div><button class="btn primary" id="create">+ Создать проект</button></header><section class="toolbar"><div class="search-wrap"><span>⌕</span><input class="search" id="search" type="search" placeholder="Поиск по названию и описанию"></div><div class="count" id="count"></div></section><main class="grid" id="grid"></main></div><div class="backdrop" id="modal"><section class="modal"><div class="mh"><h2>Создать проект</h2><button class="close" id="close">×</button></div><form id="form"><div class="field"><label for="name">Название *</label><input id="name" maxlength="80" required><div class="error" id="err">Введите название проекта.</div></div><div class="field"><label for="desc">Описание</label><textarea id="desc" maxlength="300"></textarea></div><div class="field"><label for="status">Статус</label><select id="status"><option value="active">В работе</option><option value="planned">Запланирован</option><option value="paused">На паузе</option></select></div><div class="field"><label for="owner">Ответственный</label><input id="owner" maxlength="60" placeholder="Тестовый пользователь"></div><div class="actions"><button type="button" class="btn secondary" id="cancel">Отмена</button><button class="btn primary">Сохранить проект</button></div></form></section></div><div class="toast" id="toast"></div><script>
const key='demo_projects_v1',seed=[['Обновление корпоративного сайта','Редизайн основных страниц и улучшение навигации.','active','Алексей'],['Мобильное приложение','Тестовый проект для демонстрации списка задач.','planned','Мария'],['Аналитический дашборд','Визуализация ключевых показателей команды.','paused','Иван']].map((x,i)=>({id:String(i+1),name:x[0],description:x[1],status:x[2],owner:x[3],createdAt:'2026-09-'+String(20-i*3).padStart(2,'0')}));
let projects=JSON.parse(localStorage.getItem(key)||'null')||seed;localStorage.setItem(key,JSON.stringify(projects));
const $=id=>document.getElementById(id),grid=$('grid'),search=$('search'),count=$('count'),modal=$('modal'),form=$('form');
const labels={active:'В работе',planned:'Запланирован',paused:'На паузе'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=search.value.trim().toLowerCase(),a=projects.filter(p=>(p.name+' '+p.description).toLowerCase().includes(q));count.textContent=`${a.length} из ${projects.length}`;grid.innerHTML=a.length?a.map(p=>`<article class="card"><div class="card-top"><h2>${esc(p.name)}</h2><span class="status ${p.status}">${labels[p.status]}</span></div><p class="description">${esc(p.description||'Без описания')}</p><div class="meta"><span>Ответственный: ${esc(p.owner||'—')}</span><span>${new Date(p.createdAt+'T00:00:00').toLocaleDateString('ru-RU')}</span></div></article>`).join(''):'<div class="empty">Проекты не найдены.<br>Попробуйте изменить запрос.</div>'}
function open(){form.reset();$('err').style.display='none';modal.classList.add('open');$('name').focus()}function close(){modal.classList.remove('open')}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
$('create').onclick=open;$('close').onclick=close;$('cancel').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};search.oninput=render;
form.onsubmit=e=>{e.preventDefault();let n=$('name').value.trim();if(!n){$('err').style.display='block';$('name').focus();return}projects.unshift({id:Date.now().toString(),name:n,description:$('desc').value.trim(),status:$('status').value,owner:$('owner').value.trim()||'Тестовый пользователь',createdAt:new Date().toISOString().slice(0,10)});localStorage.setItem(key,JSON.stringify(projects));render();close();toast('Проект сохранён')};render();
</script></body></html>
